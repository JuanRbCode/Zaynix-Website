@if (disponible()) {
<section aria-labelledby="titulo-me-gusta">
  <div class="panel">
    <div>
      <h2 id="titulo-me-gusta">¿Te gusta <em>Zaynix?</em></h2>
      <p class="cuenta" role="status">{{ mensaje() }}</p>
      <p class="nota">Un voto por conexión. <a routerLink="/privacidad">Qué se guarda</a></p>
    </div>
    <button type="button" [class.marcado]="estado()?.marcado"
      [attr.aria-disabled]="!estado() || estado()?.marcado || enviando()" (click)="marcar()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 20.5S3.5 15.4 3.5 9.2A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.5 2.8c0 6.2-8.5 11.3-8.5 11.3z" />
      </svg>
      {{ estado()?.marcado ? 'Gracias por tu apoyo' : 'Me gusta' }}
    </button>
  </div>
</section>
}
